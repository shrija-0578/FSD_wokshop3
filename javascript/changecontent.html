<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>change content</title>
</head>
<body>
    <h1 id="title">JavaScript</h1>
    <button onclick="changeContent()">Click Me</button>

    <script>
        function changeContent(){
            document.getElementById("title").innerHTML = "JavaScript is running";
        }
    </script>
    
</body>
</html>
